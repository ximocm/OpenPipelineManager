version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /core
      - /ui
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      shared-rust-dependencies:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns:
          - "*"
